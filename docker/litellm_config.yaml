model_list:
  - model_name: "gemma3:4b"
    litellm_params:
      model: "ollama_chat/gemma3:4b"
      api_base: http://ollama:11434

  - model_name: "gemma3:1b"
    litellm_params:
      model: "ollama_chat/gemma3:1b"
      api_base: http://ollama:11434

guardrails:
  - guardrail_name: "pii-filter"
    litellm_params:
      # Свой guardrail (docker/litellm/pii_guardrail.py, смонтирован рядом с конфигом) поверх
      # /mask pii-service. Встроенный guardrail presidio LiteLLM для диалогов не подходит:
      # метки нумеруются заново в каждом сообщении (разные люди получают одну <NAME_1>),
      # стрим копится до конца ответа, рассуждения и tool calls не восстанавливаются.
      # Сравнение — docs/litellm_guardrail.md.
      guardrail: pii_guardrail.PIIGuardrail
      mode: [pre_call, post_call]
      default_on: true
      pii_api_base: "http://pii-service:5001"

      # ── Политика фильтрации ───────────────────────────────────────────────
      # Для каждой сущности:
      #   "PSEUDONYMIZE" — только NAME: ФИО заменяется правдоподобным ФИО того же рода и в том же
      #                    падеже («Петрову Ивану Сергеевичу» → «Тарасову Денису Андреевичу»),
      #                    в ответе возвращается исходное ФИО в нужном падеже
      #   "MASK"  — замена меткой <EMAIL_1>; в ответе метка заменяется исходным значением
      #   "BLOCK" — запрос отклоняется (HTTP 400)
      #   "ALLOW" — не трогать
      # Не указанные типы — MASK. Сменить политику: изменить значения ниже, затем
      #   docker compose restart litellm (пересборка не нужна)
      pii_policy:
        NAME: "PSEUDONYMIZE"
        ADDRESS: "MASK"
        EMAIL: "MASK"
        PHONE_NUMBER: "MASK"
        INN: "MASK"
        KPP: "MASK"
        OGRN: "MASK"
        OGRNIP: "MASK"
        SNILS: "MASK"
        PASSPORT_NUMBER: "MASK"
        BANK_CARD_NUMBER: "MASK"
        CVC: "MASK"
        TOKEN: "MASK"

      # Минимальный score по типу ("ALL" — для остальных), например NAME: 0.9
      # pii_score_thresholds: {ALL: 0.5}

      # Термины, которые не считаются ПД (названия компаний, месторождений, ...);
      # ещё можно задать файлом: PII_ALLOW_LIST_FILE у pii-service
      # pii_allow_list: ["Сухой Лог"]

      # Добавлять в system prompt просьбу не изменять метки (true по умолчанию)
      # pii_placeholder_hint: true

litellm_settings:
  request_timeout: 60

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: true
  store_prompts_in_spend_logs: true
